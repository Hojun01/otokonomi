<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジョッキフライト</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Kosugi+Maru&display=swap');
  :root {
    --lantern-red: #e2452f; --lantern-glow: #ff9d52; --lantern-dark: #7a1f16;
    --text-cream: #fdf3e2; --floor: #2e1a12; --floor-line: #46281a;
  }
  html, body { margin:0; padding:0; height:100%; background:#120a0d; display:flex; align-items:center; justify-content:center; font-family:'Kosugi Maru',sans-serif; overflow:hidden; touch-action:manipulation; }
  #stage { position:relative; width:420px; max-width:100vw; aspect-ratio:420/620; border-radius:18px; overflow:hidden; box-shadow:0 20px 60px rgba(0,0,0,0.6),0 0 0 3px #3a1c12,0 0 0 6px #1a0d08; cursor:pointer; user-select:none; }
  canvas { display:block; width:100%; height:100%; }
  #hud { position:absolute; top:14px; left:0; right:0; text-align:center; color:var(--text-cream); font-size:34px; text-shadow:0 2px 0 rgba(0,0,0,0.5),0 0 12px rgba(255,157,82,0.4); pointer-events:none; letter-spacing:1px; }
  #overlay { position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:10px; color:var(--text-cream); background:radial-gradient(ellipse at center,rgba(20,8,8,0.35) 0%,rgba(15,6,8,0.75) 100%); text-align:center; padding:20px; box-sizing:border-box; }
  #overlay h1 { font-size:36px; margin:0 0 4px 0; color:var(--lantern-glow); text-shadow:0 3px 0 rgba(0,0,0,0.5),0 0 20px rgba(255,157,82,0.6); }
  #overlay p { margin:4px 0; font-size:15px; opacity:0.9; line-height:1.6; }
  #overlay .big { font-size:20px; color:var(--lantern-glow); }
  #overlay .badge { display:inline-block; margin-top:10px; padding:10px 26px; background:linear-gradient(180deg,var(--lantern-red),var(--lantern-dark)); border-radius:999px; font-size:17px; box-shadow:0 4px 0 #4a120c,0 6px 14px rgba(0,0,0,0.4); cursor:pointer; }
  .hidden { display:none !important; }
  .name-row { margin:10px 0 2px 0; }
  #nameInput { width:200px; max-width:70vw; padding:10px 14px; border-radius:999px; border:2px solid var(--lantern-glow); background:rgba(20,10,8,0.55); color:var(--text-cream); font-family:'Kosugi Maru',sans-serif; font-size:15px; text-align:center; outline:none; }
  #nameInput::placeholder { color:rgba(253,243,226,0.5); }
  #nameInput.shake { animation:shake 0.4s; border-color:var(--lantern-red); }
  @keyframes shake { 0%,100%{transform:translateX(0)} 25%{transform:translateX(-6px)} 75%{transform:translateX(6px)} }
  .leaderboard { margin-top:14px; width:250px; max-width:80vw; background:rgba(20,10,8,0.5); border:1px solid rgba(255,157,82,0.3); border-radius:14px; padding:10px 14px; }
  .lb-title { font-size:14px; color:var(--lantern-glow); margin-bottom:6px; text-align:center; }
  .lb-list { max-height:140px; overflow-y:auto; font-size:13px; display:flex; flex-direction:column; gap:4px; }
  .lb-row { display:flex; justify-content:space-between; gap:10px; padding:2px 4px; border-radius:6px; }
  .lb-row.me { background:rgba(255,157,82,0.18); }
  .lb-rank { width:22px; opacity:0.85; }
  .lb-name { flex:1; text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .lb-score { font-weight:bold; color:var(--lantern-glow); }
  #footer-tip { position:absolute; bottom:10px; left:0; right:0; text-align:center; font-size:12px; color:rgba(253,243,226,0.55); pointer-events:none; }
</style>
</head>
<body>
<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">0</div>
  <div id="overlay">
    <h1>🍺 ジョッキフライト</h1>
    <p>クリック / タップ で泡ジャンプ！<br>串と皿タワーの隙間を抜けよう</p>
    <div class="name-row">
      <input id="nameInput" type="text" maxlength="10" placeholder="なまえ（10文字まで）" autocomplete="off">
    </div>
    <div class="badge" id="startBtn">はじめる</div>
    <div class="leaderboard">
      <div class="lb-title">🏆 みんなのランキング</div>
      <div id="lbList" class="lb-list">読み込み中…</div>
    </div>
  </div>
  <div id="footer-tip">漢飲み Presents</div>
</div>

<!-- Firebase SDK -->
<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getFirestore, collection, addDoc, getDocs, query, orderBy, limit } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAatOeUd3gBS25lFiIR49sLyeDVTz6owtU",
    authDomain: "otokonomi-b83ef.firebaseapp.com",
    projectId: "otokonomi-b83ef",
    storageBucket: "otokonomi-b83ef.firebasestorage.app",
    messagingSenderId: "796063621334",
    appId: "1:796063621334:web:b712179642b59904a0a977",
    measurementId: "G-JK991XJJ3J"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);
  const LB_COLLECTION = "leaderboard";
  const LB_MAX = 10;

  async function loadLeaderboard() {
    try {
      const q = query(collection(db, LB_COLLECTION), orderBy("score", "desc"), limit(LB_MAX));
      const snap = await getDocs(q);
      return snap.docs.map(d => d.data());
    } catch(e) { return []; }
  }

  async function submitScore(name, sc) {
    try {
      await addDoc(collection(db, LB_COLLECTION), { name, score: sc, ts: Date.now() });
    } catch(e) {}
    return await loadLeaderboard();
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function renderLeaderboard(list, containerId, highlightName, highlightScore) {
    const el = document.getElementById(containerId);
    if (!el) return;
    if (!list || !list.length) {
      el.innerHTML = '<div class="lb-row"><span class="lb-name">まだ記録なし。1番乗りだ！</span></div>';
      return;
    }
    const medals = ['🥇','🥈','🥉'];
    el.innerHTML = list.slice(0,10).map((entry,i) => {
      const isMe = highlightName && entry.name===highlightName && entry.score===highlightScore;
      return `<div class="lb-row${isMe?' me':''}">
        <span class="lb-rank">${medals[i]||(i+1)}</span>
        <span class="lb-name">${escapeHtml(entry.name)}</span>
        <span class="lb-score">${entry.score}</span>
      </div>`;
    }).join('');
  }

  // ゲームにFirebase関数を渡す
  window._fb = { loadLeaderboard, submitScore, renderLeaderboard };
  loadLeaderboard().then(list => renderLeaderboard(list, 'lbList', '', 0));
</script>

<script>
(function() {
  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const nameInput = document.getElementById('nameInput');
  const startBtn = document.getElementById('startBtn');
  const ctx = canvas.getContext('2d');

  const GRAVITY=1800, FLAP=-520, PIPE_SPEED=180, PIPE_INTERVAL=1600, FLOOR_H=48, GAP=155;
  let W,H,pipes,mug,score,best,state,elapsed,spawnTimer,bubbles,playerName;

  const skewerBodyImg = new Image(); skewerBodyImg.src='https://em-content.zobj.net/source/apple/391/meat-on-bone_1f356.png';
  const skewerTipImg  = new Image(); skewerTipImg.src='https://em-content.zobj.net/source/apple/391/chopsticks_1f962.png';
  const plateUnitImg  = new Image(); plateUnitImg.src='https://em-content.zobj.net/source/apple/391/plate-with-cutlery_1f37d-fe0f.png';

  function resize() {
    const r=stage.getBoundingClientRect();
    W=canvas.width=r.width*devicePixelRatio; H=canvas.height=r.height*devicePixelRatio;
    ctx.scale(devicePixelRatio,devicePixelRatio); W=r.width; H=r.height;
  }

  function resetGame() {
    resize(); pipes=[]; score=0; elapsed=0; spawnTimer=0; bubbles=[];
    mug={x:W*0.28,y:H*0.45,vy:0,r:22}; state='waiting'; hud.textContent='0';
  }

  function flap() {
    if(state==='waiting') {
      const name=nameInput.value.trim();
      if(!name){nameInput.classList.add('shake');setTimeout(()=>nameInput.classList.remove('shake'),400);return;}
      playerName=name; overlay.style.display='none'; state='playing'; best=0;
    }
    if(state==='playing'){mug.vy=FLAP; spawnBubbles();}
    if(state==='gameover'){resetGame();overlay.style.display='none';state='playing';}
  }

  function spawnBubbles() {
    for(let i=0;i<5;i++) bubbles.push({x:mug.x+(Math.random()-.5)*16,y:mug.y+14,vy:1.5+Math.random()*1.5,r:2+Math.random()*3,life:.6+Math.random()*.4});
  }

  function spawnPipe() {
    const gapY=H*.18+Math.random()*(H*.62-H*.18);
    pipes.push({x:W+40,gapY,gapH:GAP,passed:false,skewerSway:Math.random()*6.28});
  }

  function drawBackground() {
    const g=ctx.createLinearGradient(0,0,0,H);
    g.addColorStop(0,'#2b1016');g.addColorStop(.5,'#4a1d1c');g.addColorStop(1,'#1a1024');
    ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  }

  function drawFloor() {
    const gy=H-FLOOR_H; ctx.fillStyle='#2e1a12'; ctx.fillRect(0,gy,W,FLOOR_H);
    ctx.strokeStyle='#46281a'; ctx.lineWidth=1.5;
    for(let x=0;x<W;x+=24){ctx.beginPath();ctx.moveTo(x,gy);ctx.lineTo(x+12,gy+FLOOR_H);ctx.stroke();}
  }

  function drawSkewer(cx,topY,bottomY) {
    ctx.save(); const w=44;
    const bodyReady=skewerBodyImg.complete&&skewerBodyImg.naturalWidth>0;
    const tipReady=skewerTipImg.complete&&skewerTipImg.naturalWidth>0;
    if(bodyReady&&tipReady){
      const bH=w*(skewerBodyImg.naturalHeight/skewerBodyImg.naturalWidth);
      const tH=w*(skewerTipImg.naturalHeight/skewerTipImg.naturalWidth);
      const tipTop=bottomY-tH; ctx.drawImage(skewerTipImg,cx-w/2,tipTop,w,tH);
      const count=Math.max(1,Math.ceil((tipTop-topY)/bH));
      for(let i=0;i<count;i++) ctx.drawImage(skewerBodyImg,cx-w/2,tipTop-i*bH-bH,w,bH);
    } else {
      ctx.font='28px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let ey=topY;ey<bottomY-30;ey+=30) ctx.fillText('🍢',cx,ey+15);
      ctx.fillText('🥢',cx,bottomY-16);
    }
    ctx.restore();
    return {top:0,bottom:bottomY,left:cx-w*.32,right:cx+w*.32};
  }

  function drawPlateTower(cx,groundY,towerTop) {
    const w=76,availH=Math.max(20,groundY-towerTop);
    ctx.beginPath(); ctx.ellipse(cx,groundY+2,w*.42,6,0,0,Math.PI*2);
    ctx.fillStyle='rgba(15,8,4,0.32)'; ctx.fill();
    if(plateUnitImg.complete&&plateUnitImg.naturalWidth>0){
      const uH=w*(plateUnitImg.naturalHeight/plateUnitImg.naturalWidth);
      const count=Math.max(1,Math.ceil(availH/uH));
      for(let i=0;i<count;i++) ctx.drawImage(plateUnitImg,cx-w/2,groundY-(i+1)*uH,w,uH);
    } else {
      ctx.font='32px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
      ctx.textAlign='center'; ctx.textBaseline='middle';
      for(let ey=towerTop;ey<groundY;ey+=36) ctx.fillText('🍽️',cx,ey+18);
    }
    return {top:towerTop,bottom:groundY,left:cx-w*.4,right:cx+w*.4};
  }

  function drawMug() {
    ctx.save(); ctx.translate(mug.x,mug.y);
    ctx.rotate(Math.max(-.4,Math.min(.9,mug.vy/700)));
    ctx.font='38px "Apple Color Emoji","Segoe UI Emoji",sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle'; ctx.fillText('🍺',0,2);
    ctx.restore();
  }

  function drawBubbles(dt) {
    ctx.fillStyle='rgba(255,255,255,0.85)';
    bubbles.forEach(b=>{b.y-=b.vy*dt;b.life-=dt*1.2;ctx.globalAlpha=Math.max(b.life,0);ctx.beginPath();ctx.arc(b.x,b.y,b.r,0,Math.PI*2);ctx.fill();});
    ctx.globalAlpha=1; bubbles=bubbles.filter(b=>b.life>0);
  }

  function circleRectHit(cx,cy,r,rect) {
    const clx=Math.max(rect.left,Math.min(cx,rect.right)), cly=Math.max(rect.top,Math.min(cy,rect.bottom));
    return (cx-clx)**2+(cy-cly)**2<r*r;
  }

  function showGameOver() {
    overlay.innerHTML=`
      <h1>🍻 かんぱーい！</h1>
      <p class="big">${playerName} さんのスコア: ${score}　ベスト: ${best}</p>
      <p>串と皿タワーにぶつかっちゃった…</p>
      <div class="badge" id="startBtn2">もう一度</div>
      <div class="leaderboard">
        <div class="lb-title">🏆 みんなのランキング</div>
        <div id="lbList2" class="lb-list">送信中…</div>
      </div>`;
    overlay.style.display='flex';
    document.getElementById('startBtn2').addEventListener('click',e=>{e.stopPropagation();flap();});
    if(window._fb) {
      window._fb.submitScore(playerName,score).then(list=>window._fb.renderLeaderboard(list,'lbList2',playerName,score));
    }
  }

  let lastTime=null;
  function loop(ts) {
    if(!lastTime) lastTime=ts;
    let dt=Math.min((ts-lastTime)/1000,.033); lastTime=ts;
    drawBackground();
    if(state==='playing'){
      elapsed+=dt; spawnTimer+=dt*1000;
      if(spawnTimer>PIPE_INTERVAL){spawnTimer=0;spawnPipe();}
      mug.vy+=GRAVITY*dt; mug.y+=mug.vy*dt;
      pipes.forEach(p=>p.x-=PIPE_SPEED*dt);
      pipes=pipes.filter(p=>p.x>-80);
    }
    let hit=false;
    pipes.forEach(p=>{
      p.skewerSway+=dt;
      const sr=drawSkewer(p.x,0,p.gapY);
      const gr=H-FLOOR_H;
      const pr=drawPlateTower(p.x,gr,p.gapY+p.gapH);
      if(state==='playing'){
        if(!p.passed&&p.x<mug.x){p.passed=true;score++;hud.textContent=score;}
        if(circleRectHit(mug.x,mug.y,mug.r*.7,sr)||circleRectHit(mug.x,mug.y,mug.r*.7,pr)) hit=true;
      }
    });
    drawFloor(); drawBubbles(dt); drawMug();
    if(state==='playing'){
      if(mug.y+mug.r*.6>H-FLOOR_H||mug.y-mug.r<0) hit=true;
      if(hit){state='gameover';best=Math.max(best,score);showGameOver();}
    }
    requestAnimationFrame(loop);
  }

  stage.addEventListener('click',flap);
  stage.addEventListener('touchstart',e=>{e.preventDefault();flap();},{passive:false});
  window.addEventListener('keydown',e=>{if(document.activeElement===nameInput)return;if(e.code==='Space'){e.preventDefault();flap();}});
  nameInput.addEventListener('click',e=>e.stopPropagation());
  nameInput.addEventListener('touchstart',e=>e.stopPropagation());
  nameInput.addEventListener('keydown',e=>{e.stopPropagation();if(e.key==='Enter')flap();});
  startBtn.addEventListener('click',e=>{e.stopPropagation();flap();});
  resetGame();
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
