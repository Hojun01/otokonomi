<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ジョッキフライト</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  :root {
    --sky-top: #2b1016;
    --sky-mid: #4a1d1c;
    --sky-bottom: #1a1024;
    --lantern-red: #e2452f;
    --lantern-glow: #ff9d52;
    --lantern-dark: #7a1f16;
    --plate-cream: #f3e9d8;
    --plate-rim: #c9962f;
    --plate-shadow: #a8752a;
    --beer-amber: #f0a92e;
    --beer-dark: #c9791a;
    --foam: #fffaf0;
    --floor: #2e1a12;
    --floor-line: #46281a;
    --text-cream: #fdf3e2;
  }

  html, body {
    margin: 0;
    padding: 0;
    height: 100%;
    background: #120a0d;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Noto Sans JP', sans-serif;
    overflow: hidden;
    touch-action: manipulation;
  }

  #stage {
    position: relative;
    width: 420px;
    max-width: 100vw;
    aspect-ratio: 420 / 620;
    border-radius: 18px;
    overflow: hidden;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 3px #3a1c12, 0 0 0 6px #1a0d08;
    cursor: pointer;
    user-select: none;
  }

  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }

  #hud {
    position: absolute;
    top: 14px;
    left: 0;
    right: 0;
    text-align: center;
    color: var(--text-cream);
    font-size: 34px;
    text-shadow: 0 2px 0 rgba(0,0,0,0.5), 0 0 12px rgba(255,157,82,0.4);
    pointer-events: none;
    letter-spacing: 1px;
  }

  #overlay {
    position: absolute;
    inset: 0;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 10px;
    color: var(--text-cream);
    background: radial-gradient(ellipse at center, rgba(20,8,8,0.35) 0%, rgba(15,6,8,0.75) 100%);
    text-align: center;
    padding: 20px;
    box-sizing: border-box;
  }

  #overlay h1 {
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 40px;
    margin: 0 0 4px 0;
    color: var(--lantern-glow);
    text-shadow: 0 3px 0 rgba(0,0,0,0.5), 0 0 20px rgba(255,157,82,0.6);
  }

  #overlay p {
    margin: 4px 0;
    font-size: 16px;
    opacity: 0.9;
    line-height: 1.6;
  }

  #overlay .big {
    font-size: 22px;
    color: var(--lantern-glow);
  }

  #overlay .badge {
    display: inline-block;
    margin-top: 10px;
    padding: 10px 26px;
    background: linear-gradient(180deg, var(--lantern-red), var(--lantern-dark));
    border-radius: 999px;
    font-size: 17px;
    box-shadow: 0 4px 0 #4a120c, 0 6px 14px rgba(0,0,0,0.4);
  }

  .hidden { display: none !important; }

  .name-row {
    margin: 10px 0 2px 0;
  }

  #nameInput {
    width: 220px;
    max-width: 70vw;
    padding: 10px 14px;
    border-radius: 999px;
    border: 2px solid var(--lantern-glow);
    background: rgba(20,10,8,0.55);
    color: var(--text-cream);
    font-family: 'Noto Sans JP', sans-serif;
    font-size: 16px;
    text-align: center;
    outline: none;
  }

  #nameInput::placeholder {
    color: rgba(253,243,226,0.5);
  }

  #nameInput.shake {
    animation: shake 0.4s;
    border-color: var(--lantern-red);
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }

  .leaderboard {
    margin-top: 18px;
    width: 260px;
    max-width: 80vw;
    background: rgba(20,10,8,0.5);
    border: 1px solid rgba(255,157,82,0.3);
    border-radius: 14px;
    padding: 10px 14px;
    pointer-events: auto;
  }

  .lb-tabs {
    display: flex;
    gap: 6px;
    justify-content: center;
    margin-bottom: 8px;
  }
  .lb-tabs button {
    touch-action: manipulation;
    flex: 1;
    padding: 5px 0;
    font-size: 12px;
    font-family: inherit;
    color: rgba(253,243,226,0.65);
    background: rgba(20,10,8,0.5);
    border: 1px solid rgba(255,157,82,0.25);
    border-radius: 999px;
    cursor: pointer;
    transition: all .2s;
  }
  .lb-tabs button.active {
    color: #1a0d08;
    background: var(--lantern-glow, #ff9d52);
    border-color: var(--lantern-glow, #ff9d52);
    font-weight: 700;
  }
  .lb-title {
    font-size: 15px;
    color: var(--lantern-glow);
    margin-bottom: 6px;
    text-align: center;
  }

  .lb-list {
    max-height: 150px;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    touch-action: pan-y;
    overscroll-behavior: contain;
    font-size: 13px;
    display: flex;
    flex-direction: column;
    gap: 4px;
  }

  .lb-row {
    display: flex;
    justify-content: space-between;
    gap: 10px;
    padding: 2px 4px;
    border-radius: 6px;
  }

  .lb-row.me {
    background: rgba(255,157,82,0.18);
  }

  .lb-rank {
    width: 22px;
    opacity: 0.85;
  }

  .lb-name {
    flex: 1;
    text-align: left;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  .lb-score {
    font-weight: bold;
    color: var(--lantern-glow);
  }

  #footer-tip {
    position: absolute;
    bottom: 10px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 12px;
    color: rgba(253,243,226,0.55);
    pointer-events: none;
  }
</style>
</head>
<body>

<div id="stage">
  <canvas id="game"></canvas>
  <div id="hud">0</div>
  <div id="overlay">
    <h1>🍺 ジョッキフライト</h1>
    <p>クリック / タップ で泡ジャンプ！<br>串と皿タワーの隙間を抜けよう</p>
    <div class="name-row">
      <input id="nameInput" type="text" maxlength="10" placeholder="なまえ（10文字まで）" autocomplete="off">
    </div>
    <div class="badge" id="startBtn">はじめる</div>
    <div class="leaderboard">
      <div class="lb-title">🏆 みんなのランキング</div>
      <div class="lb-tabs" id="lbTabs">
        <button data-mode="score" class="active">スコア</button>
        <button data-mode="plays">プレイ回数</button>
      </div>
      <div id="lbList" class="lb-list">読み込み中…</div>
    </div>
  </div>
  <div id="footer-tip">漢飲み Presents</div>
</div>

  const bgImg = new Image();
  bgImg.src = BG_SRC;

  const stage = document.getElementById('stage');
  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  const hud = document.getElementById('hud');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('startBtn');
  const nameInput = document.getElementById('nameInput');
  let playerName = '';
  const LB_KEY = 'leaderboard_v2';
  const LB_MAX = 50;

  const W = 420, H = 620;
  canvas.width = W;
  canvas.height = H;

  const DPR = Math.min(window.devicePixelRatio || 1, 2);
  canvas.width = W * DPR;
  canvas.height = H * DPR;
  ctx.scale(DPR, DPR);

  const FLOOR_H = 60;
  const GRAVITY = 1500;
  const FLAP_V = -420;
  const PIPE_SPEED = 165;
  const GAP_MIN = 175;
  const GAP_MAX = 205;
  const PIPE_INTERVAL = 1450;

  let mug, pipes, score, best = 0, elapsed, spawnTimer, state, bgOffset, bubbles;

  function resetGame() {
    mug = { x: 110, y: H / 2, vy: 0, r: 22, rot: 0 };
    pipes = [];
    score = 0;
    elapsed = 0;
    spawnTimer = 0;
    bgOffset = 0;
    bubbles = [];
    state = 'ready';
    hud.textContent = '0';
  }

  function flap() {
    if (state === 'ready') {
      const val = nameInput.value.trim();
      if (!val) {
        nameInput.classList.add('shake');
        nameInput.focus();
        setTimeout(() => nameInput.classList.remove('shake'), 400);
        return;
      }
      playerName = val.slice(0, 10);
      state = 'playing';
      overlay.classList.add('hidden');
    }
    if (state === 'playing') {
      mug.vy = FLAP_V;
      for (let i = 0; i < 4; i++) {
        bubbles.push({
          x: mug.x - 10 + Math.random() * 20,
          y: mug.y + 14,
          r: 2 + Math.random() * 3,
          vy: 60 + Math.random() * 60,
          life: 1
        });
      }
    }
    if (state === 'gameover') {
      resetGame();
      state = 'playing';
      overlay.classList.add('hidden');
    }
  }

  function spawnPipe() {
    const gap = GAP_MIN + Math.random() * (GAP_MAX - GAP_MIN);
    const margin = 70;
    const gapY = margin + Math.random() * (H - FLOOR_H - gap - margin * 1.2);
    pipes.push({
      x: W + 40,
      gapY: gapY,
      gapH: gap,
      passed: false,
      skewerSway: Math.random() * Math.PI * 2
    });
  }

  // ---------- drawing helpers ----------

  function drawBackground(dt) {
    bgOffset += dt * 10;

    if (bgImg.complete && bgImg.naturalWidth > 0) {
      const scale = 1.12;
      const dw = W * scale;
      const dh = H * scale;
      const drift = Math.sin(bgOffset * 0.0006) * 20;
      const dx = (W - dw) / 2 + drift;
      const dy = (H - dh) / 2;
      ctx.drawImage(bgImg, dx, dy, dw, dh);
    } else {
      // fallback gradient while the photo loads
      const g = ctx.createLinearGradient(0, 0, 0, H);
      g.addColorStop(0, '#2b1016');
      g.addColorStop(0.55, '#4a1d1c');
      g.addColorStop(1, '#1a1024');
      ctx.fillStyle = g;
      ctx.fillRect(0, 0, W, H);
    }

    // gentle vignette so the HUD and obstacles stay readable over the photo
    const overlay = ctx.createLinearGradient(0, 0, 0, H);
    overlay.addColorStop(0, 'rgba(10,4,6,0.18)');
    overlay.addColorStop(0.55, 'rgba(10,4,6,0.05)');
    overlay.addColorStop(1, 'rgba(5,2,3,0.4)');
    ctx.fillStyle = overlay;
    ctx.fillRect(0, 0, W, H);
  }

  function drawFloor() {
    const y = H - FLOOR_H;
    ctx.fillStyle = '#2e1a12';
    ctx.fillRect(0, y, W, FLOOR_H);
    ctx.strokeStyle = 'rgba(70,40,26,0.9)';
    ctx.lineWidth = 2;
    const off = (bgOffset * 8.25) % 40;
    for (let x = -40; x < W + 40; x += 40) {
      ctx.beginPath();
      ctx.moveTo(x - off, y);
      ctx.lineTo(x - off - 14, H);
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.moveTo(0, y + 3);
    ctx.lineTo(W, y + 3);
    ctx.strokeStyle = 'rgba(255,157,82,0.35)';
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  function roundRectPath(ctx, x, y, w, h, r) {
    ctx.moveTo(x + r, y);
    ctx.arcTo(x + w, y, x + w, y + h, r);
    ctx.arcTo(x + w, y + h, x, y + h, r);
    ctx.arcTo(x, y + h, x, y, r);
    ctx.arcTo(x, y, x + w, y, r);
    ctx.closePath();
  }

  function blobPath(ctx, cx, cy, rx, ry, seed) {
    const pts = 12;
    ctx.beginPath();
    for (let i = 0; i <= pts; i++) {
      const a = (i / pts) * Math.PI * 2;
      const noise = 1 + 0.16 * Math.sin(a * 3 + seed) + 0.09 * Math.cos(a * 5 + seed * 2);
      const px = cx + Math.cos(a) * rx * noise;
      const py = cy + Math.sin(a) * ry * noise;
      if (i === 0) ctx.moveTo(px, py); else ctx.lineTo(px, py);
    }
    ctx.closePath();
  }

  function drawSkewer(cx, topY, bottomY, sway) {
    const swayX = Math.sin(sway) * 3;
    const w = 44;
    const midY = (topY + bottomY) / 2;

    ctx.save();
    ctx.translate(swayX, 0);

    // ambient grill glow behind the photo sprite
    const glow = ctx.createRadialGradient(cx, midY, 4, cx, midY, 60);
    glow.addColorStop(0, 'rgba(255,157,82,0.16)');
    glow.addColorStop(1, 'rgba(255,157,82,0)');
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(cx, midY, 60, 0, Math.PI * 2);
    ctx.fill();

    const bodyReady = skewerBodyImg.complete && skewerBodyImg.naturalWidth > 0;
    const tipReady = skewerTipImg.complete && skewerTipImg.naturalWidth > 0;

    if (bodyReady && tipReady) {
      const bodyUnitH = w * (skewerBodyImg.naturalHeight / skewerBodyImg.naturalWidth);
      const tipUnitH = w * (skewerTipImg.naturalHeight / skewerTipImg.naturalWidth);

      // tip (bamboo point) sits right at the bottom of the gap
      const tipTop = bottomY - tipUnitH;
      ctx.drawImage(skewerTipImg, cx - w / 2, tipTop, w, tipUnitH);

      // tile same-size chicken/negi body units upward to fill the length
      const count = Math.max(1, Math.ceil((tipTop - topY) / bodyUnitH));
      for (let i = 0; i < count; i++) {
        const yBottom = tipTop - i * bodyUnitH;
        const yTop = yBottom - bodyUnitH;
        ctx.drawImage(skewerBodyImg, cx - w / 2, yTop, w, bodyUnitH);
      }
    }

    ctx.restore();

    return { top: 0, bottom: bottomY, left: cx - w * 0.32, right: cx + w * 0.32 };
  }

  function drawPlateTower(cx, groundY, towerTop) {
    const w = 76;
    const availH = Math.max(20, groundY - towerTop);

    // contact shadow on the floor
    ctx.beginPath();
    ctx.ellipse(cx, groundY + 2, w * 0.42, 6, 0, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(15,8,4,0.32)';
    ctx.fill();

    if (plateUnitImg.complete && plateUnitImg.naturalWidth > 0) {
      const unitH = w * (plateUnitImg.naturalHeight / plateUnitImg.naturalWidth);

      // stack whole copies of the photo upward from the floor to fill the tower
      const count = Math.max(1, Math.ceil(availH / unitH));
      for (let i = 0; i < count; i++) {
        const yTop = groundY - (i + 1) * unitH;
        ctx.drawImage(plateUnitImg, cx - w / 2, yTop, w, unitH);
      }
    }

    return { top: towerTop, bottom: groundY, left: cx - w * 0.4, right: cx + w * 0.4 };
  }

  function drawMug() {
    ctx.save();
    ctx.translate(mug.x, mug.y);
    const rot = Math.max(-0.4, Math.min(0.9, mug.vy / 700));
    ctx.rotate(rot);

    ctx.font = '38px "Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'middle';
    ctx.fillText('🍺', 0, 2);

    ctx.restore();
  }

  function drawBubbles(dt) {
    ctx.fillStyle = 'rgba(255,255,255,0.85)';
    bubbles.forEach(b => {
      b.y -= b.vy * dt;
      b.life -= dt * 1.2;
      ctx.globalAlpha = Math.max(b.life, 0);
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    });
    ctx.globalAlpha = 1;
    bubbles = bubbles.filter(b => b.life > 0);
  }

  function circleRectHit(cx, cy, r, rect) {
    const closestX = Math.max(rect.left, Math.min(cx, rect.right));
    const closestY = Math.max(rect.top, Math.min(cy, rect.bottom));
    const dx = cx - closestX;
    const dy = cy - closestY;
    return (dx * dx + dy * dy) < (r * r);
  }

  // ---------- main loop ----------
  let lastTime = null;

  function loop(ts) {
    if (lastTime === null) lastTime = ts;
    let dt = (ts - lastTime) / 1000;
    dt = Math.min(dt, 0.033);
    lastTime = ts;

    drawBackground(dt);

    if (state === 'playing') {
      elapsed += dt;
      spawnTimer += dt * 1000;
      if (spawnTimer > PIPE_INTERVAL) {
        spawnTimer = 0;
        spawnPipe();
      }

      mug.vy += GRAVITY * dt;
      mug.y += mug.vy * dt;

      pipes.forEach(p => p.x -= PIPE_SPEED * dt);
      pipes = pipes.filter(p => p.x > -80);
    }

    // draw pipes (skewer top, plates bottom) + collect collision rects
    let hit = false;
    pipes.forEach(p => {
      p.skewerSway += dt;
      const skewerRect = drawSkewer(p.x, 0, p.gapY, p.skewerSway);
      const groundY = H - FLOOR_H;
      const plateRect = drawPlateTower(p.x, groundY, p.gapY + p.gapH);

      if (state === 'playing') {
        if (!p.passed && p.x < mug.x) {
          p.passed = true;
          score++;
          hud.textContent = score;
        }
        if (circleRectHit(mug.x, mug.y, mug.r * 0.7, skewerRect) ||
            circleRectHit(mug.x, mug.y, mug.r * 0.7, plateRect)) {
          hit = true;
        }
      }
    });

    drawFloor();
    drawBubbles(dt);
    drawMug();

    if (state === 'playing') {
      if (mug.y + mug.r * 0.6 > H - FLOOR_H || mug.y - mug.r < 0) {
        hit = true;
      }
      if (hit) {
        state = 'gameover';
        best = Math.max(best, score);
        showGameOver();
      }
    }

    requestAnimationFrame(loop);
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, c => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  async function loadLeaderboard(sortKey) {
    try {
      if (window._fb && window._fb.load) return await window._fb.load(sortKey);
      return [];
    } catch (e) {
      return [];
    }
  }

  async function submitScore(name, sc) {
    try {
      if (window._fb && window._fb.submit) return await window._fb.submit(name, sc);
      return [];
    } catch (e) {
      return loadLeaderboard();
    }
  }

  function renderLeaderboard(list, containerId, highlightName, mode) {
    const el = document.getElementById(containerId);
    if (!el) return;
    const key = mode === 'plays' ? 'plays' : 'score';
    const unit = mode === 'plays' ? ' 回' : '';
    if (!list || !list.length) {
      el.innerHTML = '<div class="lb-row"><span class="lb-name">まだ記録なし。1番乗りだ！</span></div>';
      return;
    }
    const medals = ['🥇', '🥈', '🥉'];
    el.innerHTML = list.slice(0, 10).map((entry, i) => {
      const rank = medals[i] || (i + 1);
      const isMe = highlightName && entry.name === highlightName;
      return `<div class="lb-row${isMe ? ' me' : ''}">
        <span class="lb-rank">${rank}</span>
        <span class="lb-name">${escapeHtml(entry.name)}</span>
        <span class="lb-score">${entry[key] || 0}${unit}</span>
      </div>`;
    }).join('');
  }

  // タブ切り替え付きランキングを描画
  function setupLB(listId, tabsId, highlightName, initialList) {
    let current = 'score';
    const tabs = document.getElementById(tabsId);
    const draw = (mode, list) => {
      renderLeaderboard(list, listId, highlightName, mode);
      if (!tabs) return;
      [...tabs.children].forEach(b => b.classList.toggle('active', b.dataset.mode === mode));
    };
    if (initialList) draw('score', initialList);
    else loadLeaderboard('score').then(l => draw('score', l));

    if (tabs) {
      tabs.addEventListener('touchstart', (e) => e.stopPropagation(), { passive: true });
      tabs.addEventListener('click', (e) => {
        e.stopPropagation();
        const btn = e.target.closest('[data-mode]');
        if (!btn || btn.dataset.mode === current) return;
        current = btn.dataset.mode;
        document.getElementById(listId).innerHTML =
          '<div class="lb-row"><span class="lb-name">読み込み中…</span></div>';
        loadLeaderboard(current).then(l => draw(current, l));
      });
    }
  }

  function showGameOver() {
    overlay.innerHTML = `
      <h1>🍻 かんぱーい！</h1>
      <p class="big">${escapeHtml(playerName)} さんのスコア: ${score}　自己ベスト: ${best}</p>
      <p>串と皿タワーにぶつかっちゃった…</p>
      <div class="badge" id="startBtn2">もう一度</div>
      <div class="leaderboard">
        <div class="lb-title">🏆 みんなのランキング</div>
        <div class="lb-tabs" id="lbTabs2">
          <button data-mode="score" class="active">スコア</button>
          <button data-mode="plays">プレイ回数</button>
        </div>
        <div id="lbList2" class="lb-list">読み込み中…</div>
      </div>
    `;
    overlay.classList.remove('hidden');
    document.getElementById('startBtn2').addEventListener('click', (e) => {
      e.stopPropagation();
      flap();
    });
    submitScore(playerName, score).then(list => setupLB('lbList2', 'lbTabs2', playerName, list));
  }

  // ランキング領域の操作（スクロール・タブ）はジャンプさせない
  const inLB = (e) => !!(e.target.closest && e.target.closest('.leaderboard'));

  stage.addEventListener('click', (e) => { if (inLB(e)) return; flap(); });
  stage.addEventListener('touchstart', (e) => {
    if (inLB(e)) return;          // preventDefaultしない = スクロール可能
    e.preventDefault();
    flap();
  }, { passive: false });
  window.addEventListener('keydown', (e) => {
    if (document.activeElement === nameInput) return;
    if (e.code === 'Space') { e.preventDefault(); flap(); }
  });
  nameInput.addEventListener('click', (e) => e.stopPropagation());
  nameInput.addEventListener('touchstart', (e) => e.stopPropagation());
  nameInput.addEventListener('keydown', (e) => {
    e.stopPropagation();
    if (e.key === 'Enter') flap();
  });
  const initLB = () => setupLB('lbList', 'lbTabs', '');
  if (window._fb) initLB(); else window.addEventListener('fbready', initLB);
  startBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    flap();
  });

  resetGame();
  requestAnimationFrame(loop);
})();
</script>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/11.10.0/firebase-app.js";
  import { getFirestore, collection, doc, setDoc, getDoc, getDocs, query, orderBy, limit }
    from "https://www.gstatic.com/firebasejs/11.10.0/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAatOeUd3gBS25lFiIR49sLyeDVTz6owtU",
    authDomain: "otokonomi-b83ef.firebaseapp.com",
    projectId: "otokonomi-b83ef",
    storageBucket: "otokonomi-b83ef.firebasestorage.app",
    messagingSenderId: "796063621334",
    appId: "1:796063621334:web:b712179642b59904a0a977"
  };

  const db = getFirestore(initializeApp(firebaseConfig));
  const COL = "leaderboard";

  async function load(sortKey) {
    const key = sortKey === 'plays' ? 'plays' : 'score';
    const q = query(collection(db, COL), orderBy(key, "desc"), limit(50));
    const snap = await getDocs(q);
    return snap.docs.map(d => d.data());
  }

  async function submit(name, sc) {
    // 名前をドキュメントIDにして1人1レコードにする
    const id = name.trim().slice(0, 30).replace(/[\/\.#$\[\]]/g, '_');
    const ref = doc(db, COL, id);
    const snap = await getDoc(ref);
    const data = snap.exists() ? snap.data() : {};
    const prevScore = data.score || 0;
    const plays = (data.plays || 0) + 1;   // プレイ回数は毎回+1
    await setDoc(ref, {
      name: name.trim(),
      score: Math.max(sc, prevScore),      // スコアはベストのみ保持
      plays: plays,
      ts: Date.now()
    });
    return await load('score');
  }

  window._fb = { load, submit };
  window.dispatchEvent(new Event('fbready'));
</script>
